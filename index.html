<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>해부학 단답 자동채점</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 좌측 공정 내비 + 작업 영역. 시험지는 화면 테마와 무관하게 '종이'로 유지하고, OMR 카드의 분홍 인쇄색을 액센트로 쓴다. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#14212a; --muted:#5a6a75; --line:#d5dde2;
  --accent:#b8325a; --accent-ink:#ffffff; --accent-soft:#f8e3ea;
  --ok:#1d7a4c; --ok-soft:#dff1e7; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#b42318; --bad-soft:#fbe2df; --info:#2a5d8f; --info-soft:#e1ecf6;
  --paper:#fdfdfb; --paper-ink:#1d1d1f; --omr:#cf4a72; --omr-soft:#f6d3de; --pen:#1f2f7a;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-hand:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172027; --surface-2:#1c272f; --ink:#e4ebef; --muted:#93a4af; --line:#2a3842;
  --accent:#e66a8f; --accent-ink:#1a0d12; --accent-soft:#3a1f29;
  --ok:#55c58d; --ok-soft:#173527; --warn:#e3a842; --warn-soft:#3a2d12; --bad:#f17b70; --bad-soft:#3d1c1a; --info:#7fb2e3; --info-soft:#1a2c3d;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172027; --surface-2:#1c272f; --ink:#e4ebef; --muted:#93a4af; --line:#2a3842;
  --accent:#e66a8f; --accent-ink:#1a0d12; --accent-soft:#3a1f29;
  --ok:#55c58d; --ok-soft:#173527; --warn:#e3a842; --warn-soft:#3a2d12; --bad:#f17b70; --bad-soft:#3d1c1a; --info:#7fb2e3; --info-soft:#1a2c3d;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:.8rem;flex:none}
.brand b{font-size:1rem}
.brand span{display:block;font-size:.75rem;color:var(--muted)}
.top .spacer{flex:1}
.role{display:flex;align-items:center;gap:6px;font-size:.82rem}
.role select{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 8px}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1320px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
nav.steps{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start}
nav.steps a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav.steps a .no{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:18px}
nav.steps a .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:10px}
nav.steps a .cnt.zero{background:transparent;color:var(--muted)}
nav.steps a:hover{background:var(--surface-2)}
nav.steps a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
nav.steps .sep{height:1px;background:var(--line);margin:8px 0}
nav.steps .reset{font-size:.78rem;color:var(--muted);background:none;border:0;text-align:left;padding:6px 10px;cursor:pointer}
nav.steps .reset:hover{color:var(--bad)}
main{min-width:0;display:flex;flex-direction:column;gap:20px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.steps{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.steps a{flex:none;padding:7px 10px;background:var(--surface);border:1px solid var(--line)}
  nav.steps a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  nav.steps .sep{display:none}
  nav.steps .reset{flex:none;white-space:nowrap}
}

.head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:.84rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.kpi .val{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;line-height:1.2}
.kpi .tgt{font-size:.76rem;color:var(--muted)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden;border:1px solid var(--line)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.pipe a{display:flex;flex-direction:column;gap:4px;padding:12px 14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);margin-left:-1px}
.pipe a:first-child{border-radius:var(--r) 0 0 var(--r);margin-left:0}
.pipe a:last-child{border-radius:0 var(--r) var(--r) 0}
.pipe a:hover{background:var(--surface-2)}
.pipe .t{font-weight:600}
.pipe .s{font-size:.78rem;color:var(--muted)}
@media (max-width:700px){.pipe{grid-template-columns:minmax(0,1fr)}.pipe a{margin-left:0;margin-top:-1px;border-radius:0!important}.pipe a:first-child{border-radius:var(--r) var(--r) 0 0!important}.pipe a:last-child{border-radius:0 0 var(--r) var(--r)!important}}

.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:2px 4px 2px 0;font-size:.8rem;background:var(--surface-2)}
.chip small{color:var(--muted);font-size:.68rem}
.chip.added{border-color:var(--accent);background:var(--accent-soft)}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:.9rem;line-height:1}

/* ---------- 시험지(종이) ---------- */
.sheet-row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.sheet-col{flex:1 1 420px;min-width:0;max-width:640px;display:flex;flex-direction:column;gap:8px}
.sheet{container-type:inline-size;width:100%;aspect-ratio:210/297;background:var(--paper);color:var(--paper-ink);position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.10);border-radius:2px;overflow:hidden;max-width:100%}
.sheet-in{position:absolute;inset:0;font-size:1.95cqw;transition:transform .5s ease}
.sheet.skew .sheet-in{transform:rotate(1.6deg) scale(.965) translate(1.2%,.8%)}
.mk{position:absolute;width:4.2cqw;height:4.2cqw;background:#000}
.mk.tl{left:4cqw;top:4cqw}.mk.tr{right:4cqw;top:4cqw}.mk.bl{left:4cqw;bottom:4cqw}.mk.br{right:4cqw;bottom:4cqw}
.qr{position:absolute;right:10cqw;top:4cqw;width:9cqw;height:9cqw}
.sh-body{position:absolute;left:10cqw;right:10cqw;top:5cqw;bottom:9cqw;display:flex;flex-direction:column;gap:1.6cqw}
.sh-title{font-weight:700;font-size:3cqw;letter-spacing:-.01em;padding-right:11cqw}
.sh-sub{font-size:1.7cqw;color:#555;padding-right:11cqw}
.sh-note{border:.25cqw solid var(--omr);color:#7a2140;padding:1cqw 1.4cqw;font-size:1.65cqw;line-height:1.45}
.idbox{display:flex;gap:2cqw;align-items:flex-start}
.idgrid{display:grid;grid-template-columns:repeat(2,3.3cqw);gap:0;border:.25cqw solid var(--omr)}
.idgrid .hd{height:3.6cqw;border-bottom:.25cqw solid var(--omr);border-right:.12cqw solid var(--omr-soft);display:grid;place-items:center;font-family:var(--f-hand);font-size:3.2cqw;color:var(--pen)}
.idgrid .bb{height:2.75cqw;display:grid;place-items:center;border-right:.12cqw solid var(--omr-soft)}
.idgrid .bb i{width:2.1cqw;height:2.1cqw;border:.18cqw solid var(--omr);border-radius:50%;font-style:normal;font-size:1.25cqw;color:var(--omr);display:grid;place-items:center;line-height:1}
.idgrid .bb i.on{background:#151515;border-color:#151515;color:#151515}
.idlbl{font-size:1.5cqw;color:var(--omr);font-weight:600;margin-bottom:.5cqw}
.namebox-unused{border:.25cqw solid var(--omr);width:22cqw;height:6cqw;position:relative;font-family:var(--f-hand);font-size:4cqw;color:var(--pen);display:grid;place-items:center}
.namebox-unused::before{content:"";position:absolute;left:.6cqw;top:.2cqw;font-family:var(--f-ui);font-size:1.3cqw;color:var(--omr)}
.q{display:flex;flex-direction:column;gap:.7cqw}
.q .stem{font-size:1.85cqw;line-height:1.45}
.q .stem b{margin-right:.6cqw}
.q .pts{color:#666;font-size:1.5cqw}
.boxes{display:flex;gap:1cqw;flex-wrap:wrap}
.abox{border:.25cqw solid var(--omr);height:5.6cqw;position:relative;display:flex;align-items:center;padding:0 1.2cqw;flex:1 1 0;min-width:14cqw}
.abox.single{flex:0 0 46%}
.abox .bn{position:absolute;left:.5cqw;top:.1cqw;font-size:1.25cqw;color:var(--omr)}
.abox .hw{font-family:var(--f-hand);font-size:3.8cqw;color:var(--pen);white-space:nowrap;padding-left:1cqw}
.abox.crop{outline:.5cqw solid rgba(42,93,143,.55);outline-offset:.3cqw}
.sh-foot{position:absolute;left:10cqw;right:10cqw;bottom:4.4cqw;font-size:1.35cqw;color:#666;display:flex;justify-content:space-between;gap:2cqw}
.key{container-type:inline-size;background:var(--paper);color:var(--paper-ink);padding:5cqw 6cqw 4cqw;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.10);border-radius:2px}
.key h4{margin:0 0 .6em;font-size:max(15px,2.6cqw)}
.key table{font-size:max(11px,1.7cqw)}
.key th{background:#f1f1ee;color:#555;position:static}
.key td,.key th{border-color:#ddd;padding:.5em .6em}
.key .ft{margin-top:1.2em;font-size:max(10px,1.4cqw);color:#777;display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap}

/* ---------- 답안 이미지(손글씨 칸) ---------- */
.ans{background:var(--paper);border:1.5px solid var(--omr);border-radius:2px;height:46px;min-width:110px;display:flex;align-items:center;padding:0 10px 0 14px;position:relative;overflow:hidden;color:var(--pen)}
.ans .hw{font-family:var(--f-hand);font-size:28px;line-height:1;white-space:nowrap;transform:rotate(var(--rot,0deg))}
.ans .hw.faint{opacity:.22}
.ans .strike{position:relative;margin-right:8px}
.ans .strike::after{content:"";position:absolute;left:-2px;right:-2px;top:44%;border-top:2px solid var(--pen);box-shadow:0 5px 0 var(--pen)}
.ans .tag{position:absolute;right:3px;top:2px;font-family:var(--f-ui);font-size:9px;color:#8a4a5e}
.ans.outside{overflow:visible}
.ans.outside .hw{transform:translate(48px,-12px) rotate(-3deg)}

/* ---------- 검토 ---------- */
.toolbar{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.toolbar label{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted)}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px}
.toolbar input[type=range]{width:120px;accent-color:var(--accent)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.group.sev-must{border-left:4px solid var(--bad)}
.group.sev-rec{border-left:4px solid var(--warn)}
.group.sev-done{border-left:4px solid var(--ok)}
.group.sev-sample{border-left:4px solid var(--info)}
.g-head{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.g-head .who{min-width:0;flex:1 1 260px}
.g-head .read{font-size:1.15rem;font-weight:600}
.g-head .read .q{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-right:6px;display:inline}
.g-body{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.cellcard{display:flex;flex-direction:column;gap:4px;width:200px;max-width:100%}
.cellcard .meta{display:flex;justify-content:space-between;gap:6px;font-size:.74rem;color:var(--muted)}
.cellcard .fix{display:flex;gap:4px}
.cellcard .fix input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:var(--surface-2);font-size:.8rem}
.linkbtn{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font-size:.74rem}
.g-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.g-act input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);min-width:0;flex:1 1 180px}
.g-act select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- 차트 ---------- */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:64px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:.84rem}
.bar .track{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--info);border-radius:2px}
.bar .fill.low{background:var(--warn)}
.bar .ref{position:absolute;top:-3px;bottom:-3px;border-left:1.5px dashed var(--muted)}
.hist{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:14px;border-bottom:1px solid var(--line)}
.hist div{flex:1;background:var(--accent);opacity:.85;border-radius:2px 2px 0 0;position:relative;min-height:1px}
.hist div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:.7rem;font-family:var(--f-mono);color:var(--muted)}
.hist-x{display:flex;gap:4px;font-size:.68rem;color:var(--muted);font-family:var(--f-mono)}
.hist-x span{flex:1;text-align:center}

/* ---------- 패널(피드백) ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;
  display:flex;flex-direction:column;gap:14px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.fb-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.fb-item .ansrow{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:.86rem;z-index:30;max-width:calc(100% - 32px)}
textarea.csv{width:100%;height:140px;font-family:var(--f-mono);font-size:.76rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px}
.log{display:flex;flex-direction:column;gap:0;font-size:.84rem}
.log div{display:grid;grid-template-columns:88px 44px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.steps-list{display:flex;flex-direction:column;gap:0}

<script>
/* =========================================================
   1. 문항 데이터
   ========================================================= */
const CHAPTERS=['총론','뼈대','관절','근육','신경','심혈관','호흡'];
const K=['새 용어','옛 용어','영어'];
const mk=(...ts)=>ts.map((t,i)=>({t,kind:K[i]}));
const ITEMS=[
 {id:'Q1',ch:'뼈대',type:'single',pts:2,stem:'어깨관절과 팔꿈치관절 사이에 있는 위팔의 긴뼈 이름을 쓰시오.',slots:[mk('위팔뼈','상완골','humerus')],wrong:['노뼈','자뼈','넙다리뼈']},
 {id:'Q2',ch:'뼈대',type:'single',pts:2,stem:'넙다리네갈래근 힘줄 안에 있는, 무릎 앞쪽의 종자뼈 이름을 쓰시오.',slots:[mk('무릎뼈','슬개골','patella')],wrong:['정강뼈','종아리뼈','반달']},
 {id:'Q3',ch:'근육',type:'multi',order:false,pts:4,stem:'돌림근띠(회전근개)를 이루는 근육 네 개를 쓰시오. (순서 무관)',slots:[mk('가시위근','극상근','supraspinatus'),mk('가시아래근','극하근','infraspinatus'),mk('작은원근','소원근','teres minor'),mk('어깨밑근','견갑하근','subscapularis')],wrong:['큰원근','어깨세모근','넓은등근','등세모근']},
 {id:'Q4',ch:'신경',type:'multi',order:true,pts:3,stem:'뇌신경 제1번부터 제3번까지를 번호 순서대로 쓰시오.',slots:[mk('후각신경','후신경','olfactory nerve'),mk('시각신경','시신경','optic nerve'),mk('눈돌림신경','동안신경','oculomotor nerve')],wrong:['도르래신경','갓돌림신경','삼차신경']},
 {id:'Q5',ch:'관절',type:'single',pts:2,stem:'무릎관절에서 정강뼈가 넙다리뼈에 대해 앞으로 밀려나는 것을 막는 인대를 쓰시오.',slots:[mk('앞십자인대','전방십자인대','ACL')],wrong:['뒤십자인대','안쪽곁인대','무릎인대']},
 {id:'Q6',ch:'호흡',type:'single',pts:2,stem:'들숨 때 수축하여 가슴안의 위아래 길이를 늘리는 주된 호흡근을 쓰시오.',slots:[mk('가로막','횡격막','diaphragm')],wrong:['바깥갈비사이근','늑간근','목빗근']},
 {id:'Q7',ch:'심혈관',type:'single',pts:2,stem:'오른심방과 오른심실 사이에 있는 판막을 쓰시오.',slots:[mk('세갈래판','삼첨판','tricuspid valve')],wrong:['두갈래판','승모판','허파동맥판']},
 {id:'Q8',ch:'근육',type:'single',pts:2,stem:'팔꿈치를 굽히고 아래팔을 뒤침시키는 위팔 앞쪽의 두 갈래 근육을 쓰시오.',slots:[mk('위팔두갈래근','상완이두근','biceps brachii')],wrong:['위팔세갈래근','위팔근','위팔노근']},
 {id:'Q9',ch:'신경',type:'single',pts:2,stem:'위팔뼈 안쪽위관절융기 뒤를 지나는 신경을 쓰시오.',slots:[mk('자신경','척골신경','ulnar nerve')],wrong:['정중신경','노신경','근육피부신경']},
 {id:'Q10',ch:'총론',type:'multi',order:false,pts:3,stem:'해부학적 자세에서 몸을 나누는 세 가지 기본 면을 쓰시오. (순서 무관)',slots:[mk('시상면','정중면','sagittal plane'),mk('이마면','관상면','coronal plane'),mk('가로면','수평면','transverse plane')],wrong:['정중선','앞면','바닥면']},
];
const IT=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const TOTAL=ITEMS.reduce((a,i)=>a+i.pts,0);
const VERSION_B=['Q2','Q1','Q5','Q6','Q3','Q9','Q8','Q7','Q10','Q4'];

/* =========================================================
   2. 모의 학생·스캔 데이터 (고정 시드)
   ========================================================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20270421);
const pick=a=>a[Math.floor(R()*a.length)];
// 테스트용: 이름·학번 없이 익명 응시 번호(01~30)만 사용
const ROSTER=Array.from({length:30},(_,i)=>({id:String(i+1).padStart(2,'0')}));
const who=st=>`응시자 ${st.id}`;

// 한글 자모 단위 변형 (학생 오타·판독 오류 흉내)
const JUNG_SWAP={0:4,4:0,1:5,5:1,8:13,13:8,18:13,20:19,19:20,6:2,2:6};
function mutate(s){
  const chars=[...s];const idx=chars.map((c,i)=>/[가-힣]/.test(c)?i:-1).filter(i=>i>=0);
  if(!idx.length){ // 영어
    const i=Math.max(0,Math.floor(R()*chars.length));const m={u:'v',v:'u',r:'n',n:'r',l:'i',i:'l',e:'c',a:'o',o:'a'};
    chars[i]=m[chars[i]]||''; return chars.join('');
  }
  const i=pick(idx);const x=chars[i].charCodeAt(0)-0xAC00;let cho=Math.floor(x/588),jung=Math.floor(x%588/28),jong=x%28;
  if(R()<.5&&JUNG_SWAP[jung]!==undefined) jung=JUNG_SWAP[jung];
  else jong = jong===0?8:jong===4?21:jong===21?4:jong===8?0:0;
  chars[i]=String.fromCharCode(0xAC00+cho*588+jung*28+jong); return chars.join('');
}

function buildScans(){
  const scans=[];
  ROSTER.forEach((st,si)=>{
    const ability=.38+.58*R();
    const cells=[];
    for(const it of ITEMS){
      const n=it.slots.length;
      let order=[...Array(n).keys()];
      if(it.type==='multi'&&!it.order){for(let k=n-1;k>0;k--){const j=Math.floor(R()*(k+1));[order[k],order[j]]=[order[j],order[k]]}}
      if(it.type==='multi'&&it.order&&R()<.12){[order[1],order[2]]=[order[2],order[1]]}
      const usedWrong=new Set();
      order.forEach((slot,k)=>{
        let t='';const r=R();
        if(r<ability){const rr=R();const term=it.slots[slot][rr<.6?0:rr<.92?1:2].t;t=R()<.07?mutate(term):term}
        else if(R()<.28){t=''}
        else{let w=pick(it.wrong);if(usedWrong.has(w))w=pick(it.wrong);usedWrong.add(w);t=w}
        // 판독 시뮬레이션
        let conf=Math.min(.995,Math.max(.31,.985-Math.pow(R(),9)*.62-(/[a-z]/i.test(t)?.06:0)+(R()-.5)*.02));
        let ocr=t, faint=false, corrected=null, outside=false;
        if(!t){ if(R()<.18){faint=true;t=pick(it.slots[slot]).t;} ocr='';conf=null; }
        else{
          if(conf<.82&&R()<.55) ocr=mutate(t);
          if(R()<.03) corrected=pick(it.wrong);
          else if(R()<.012) outside=true;
        }
        cells.push({key:`${si}|${it.id}|${k}`,si,q:it.id,k,trueText:t,ocr,conf,faint,corrected,outside,rot:((R()-.5)*4).toFixed(1)});
      });
    }
    let marked=st.id;
    if(si===6) marked='3'+st.id[1];                                          // 앞자리 오마킹 (명단에 없는 번호)
    if(si===18) marked='';                                                // 마킹 누락
    scans.push({si,marked,cells,pages:2});
  });
  return scans;
}
const SCANS=buildScans();
const CELLS=SCANS.flatMap(s=>s.cells);
const CELL=Object.fromEntries(CELLS.map(c=>[c.key,c]));

/* =========================================================
   3. 상태 (브라우저에만 저장)
   ========================================================= */
const STORE='anat-grader-v2'; // v2: 이름·학번 제거 (이전 저장 상태는 쓰지 않음)
const fresh=()=>({th:{hi:.90,lo:.70},added:{},over:{},fix:{},idfix:{},log:[],role:'교수',gradeMode:'abs',finalized:false,
  weights:{quiz:20,mid:30,final:40,att:10}});
let S=fresh();
try{const raw=localStorage.getItem(STORE);if(raw)S=Object.assign(fresh(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
const now=()=>{const d=new Date();return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function log(what,reason,count){S.log.unshift({at:now(),by:S.role,what,reason:reason||'',count:count||1});S.log=S.log.slice(0,200)}

/* =========================================================
   4. 채점 엔진
   ========================================================= */
const norm=s=>(s||'').normalize('NFC').toLowerCase().replace(/[\s()\[\]\-·.,_]/g,'');
function jamo(s){const o=[];for(const ch of s){const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const x=c-0xAC00;o.push('c'+Math.floor(x/588),'v'+Math.floor(x%588/28));if(x%28)o.push('j'+x%28)}else o.push(ch)}return o}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function terms(it,slot){return [...it.slots[slot],...((S.added[it.id]||{})[slot]||[]).map(t=>({t,kind:'채점 중 추가'}))]}
function exact(it,slot,t){return terms(it,slot).find(x=>norm(x.t)===t)}
function near(it,slot,t){
  const a=jamo(t);let best=null;
  for(const x of terms(it,slot)){const b=jamo(norm(x.t));const d=lev(a,b);const lim=b.length>=9?2:1;if(d<=lim&&(!best||d<best.d))best={d,term:x.t,slot}}
  return best;
}
const readText=c=>S.fix[c.key]!==undefined?S.fix[c.key]:c.ocr;

function judgeItem(it,cells){
  const n=it.slots.length, per=it.pts/n;
  const res=cells.map(()=>null);
  const used=new Set();
  cells.forEach((c,k)=>{
    const t=norm(readText(c));
    if(!t){res[k]={v:'blank',score:0,why:'빈칸'};return}
    if(it.type==='single'||it.order){
      const slot=it.type==='single'?0:k;
      const hit=exact(it,slot,t);
      if(hit){res[k]={v:'correct',score:per,why:`인정 답안 일치 (${hit.kind}: ${hit.t})`,slot};return}
      if(it.order){for(let m=0;m<n;m++){if(m!==slot&&exact(it,m,t)){res[k]={v:'order',score:0,why:`${m+1}번 자리의 답을 ${k+1}번에 씀`,slot:m};return}}}
      const nr=near(it,slot,t);
      if(nr){res[k]={v:'typo',score:0,why:`‘${nr.term}’과 자모 ${nr.d}개 차이`,slot,near:nr.term};return}
      res[k]={v:'wrong',score:0,why:'인정 답안과 일치하지 않음'};return;
    }
    for(let m=0;m<n;m++){const hit=exact(it,m,t);if(hit){
      if(used.has(m)){res[k]={v:'dup',score:0,why:`‘${it.slots[m][0].t}’ 중복 기재`,slot:m}}
      else{used.add(m);res[k]={v:'correct',score:per,why:`인정 답안 일치 (${hit.kind}: ${hit.t})`,slot:m}}
      return}}
  });
  if(it.type==='multi'&&!it.order){
    cells.forEach((c,k)=>{if(res[k])return;const t=norm(readText(c));let best=null;
      for(let m=0;m<n;m++){const nr=near(it,m,t);if(nr&&(!best||nr.d<best.d))best=nr}
      res[k]=best?{v:'typo',score:0,why:`‘${best.term}’과 자모 ${best.d}개 차이`,slot:best.slot,near:best.term}:{v:'wrong',score:0,why:'인정 답안과 일치하지 않음'}});
  }
  return res;
}
function route(c,j){
  if(S.over[c.key]) return 'done';
  const fixed=S.fix[c.key]!==undefined;
  const conf=fixed?1:c.conf;
  if(!fixed&&!readText(c)) return 'must';
  if(!fixed&&(c.corrected||c.outside)) return 'must';
  if(conf<S.th.lo) return 'must';
  if(conf<S.th.hi) return 'rec';
  if(['typo','order','dup'].includes(j.v)) return 'rec';
  return 'auto';
}
const VL={correct:['정답','p-ok'],wrong:['오답','p-bad'],typo:['오타 의심','p-warn'],order:['순서 오류','p-warn'],dup:['중복 기재','p-warn'],blank:['무응답 후보','p-mute']};
const RL={auto:['자동 확정','p-ok'],rec:['검토 권장','p-warn'],must:['필수 검토','p-bad'],done:['검토 완료','p-info']};

function studentOf(scan){
  const id=S.idfix[scan.si]||scan.marked;
  return ROSTER.find(r=>r.id===id)||null;
}
function evaluate(){
  const out={cells:{},bySi:{}};
  for(const sc of SCANS){
    const st=studentOf(sc);
    const items={};let total=0,pending=0;
    for(const it of ITEMS){
      const cs=sc.cells.filter(c=>c.q===it.id);
      const js=judgeItem(it,cs);let sum=0;
      cs.forEach((c,k)=>{const j=js[k];const r=route(c,j);const o=S.over[c.key];
        const score=o?o.score:j.score;sum+=score;if(r==='must'||r==='rec')pending++;
        out.cells[c.key]={c,j,r,score,text:readText(c)}});
      items[it.id]=sum;total+=sum;
    }
    out.bySi[sc.si]={sc,st,items,total,pending};
  }
  return out;
}
// 자동 확정 5% 표본 (고정)
const SAMPLE=new Set(CELLS.filter((c,i)=>(i*7919)%20===3).map(c=>c.key));

/* =========================================================
   5. 공통 렌더 도우미
   ========================================================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);
const pill=(t,c)=>`<span class="pill ${c}">${esc(t)}</span>`;
const pct=x=>(x*100).toFixed(1)+'%';
const f1=x=>(Math.round(x*10)/10).toString();
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function ansImg(c,opts={}){
  const text=c.trueText;
  if(!text) return `<div class="ans"><span class="tag">빈칸</span></div>`;
  return `<div class="ans ${c.outside?'outside':''}" title="답안칸 이미지 (스캔)">${c.corrected?`<span class="hw strike" style="--rot:${c.rot}deg">${esc(c.corrected)}</span>`:''}<span class="hw ${c.faint?'faint':''}" style="--rot:${c.rot}deg">${esc(text)}</span>${c.outside?'<span class="tag">칸 밖</span>':''}${c.faint?'<span class="tag">연한 글씨</span>':''}</div>`;
}
function qrSvg(str){
  let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}const r=rng(h>>>0);const N=21;let rects='';
  const finder=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||j===0||i===6||j===6||(i>=2&&i<=4&&j>=2&&j<=4);if(e)rects+=`<rect x="${x+i}" y="${y+j}" width="1" height="1"/>`}};
  finder(0,0);finder(14,0);finder(0,14);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const inF=(i<8&&j<8)||(i>12&&j<8)||(i<8&&j>12);if(!inF&&r()<.48)rects+=`<rect x="${i}" y="${j}" width="1" height="1"/>`}
  return `<svg class="qr" viewBox="-1 -1 23 23" aria-label="페이지 QR (모형): ${esc(str)}"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

function kpi(l,v,t,ratio,target){
  return `<div class="kpi"><span class="lbl">${l}</span><span class="val">${v}</span>${ratio!==undefined?`<div class="meter"><i style="width:${Math.min(1,ratio)*100}%;background:${ratio>=target?'var(--ok)':'var(--warn)'}"></i><b style="left:calc(${target*100}% - 1px)"></b></div>`:''}<span class="tgt">${t}</span></div>`;
}

    return `<div class="q"><div class="stem"><b>${no}.</b>${esc(it.stem)} <span class="pts">[${it.pts}점]</span></div><div class="boxes">${boxes}</div></div>`}).join('');

function answerKey(kind){
  const ord=order(sheetVer);
  const rows=ord.map((qid,i)=>{const it=IT[qid];
    const ans=it.slots.map((s,m)=>{const ts=terms(it,m);
      if(kind==='grader') return ts.map(x=>`${esc(x.t)}${x.kind==='채점 중 추가'?' <b style="color:#b8325a">(추가)</b>':''}`).join(', ');
      return `${esc(ts[0].t)} <span style="color:#777">(${esc(ts[1].t)})</span>`}).join(it.type==='multi'?'<br>':'');
    const rule=it.type==='single'?'완전 일치 시 만점':it.order?`칸별 ${f1(it.pts/it.slots.length)}점, 자리 바뀌면 해당 칸 0점`:`칸별 ${f1(it.pts/it.slots.length)}점, 순서 무관, 중복은 1회만 인정`;
    return `<tr><td>${i+1}</td><td>${it.ch}</td><td style="text-align:right">${it.pts}</td><td>${ans}</td><td>${rule}</td></tr>`}).join('');
  return `<div class="key"><h4>정답지 · ${kind==='grader'?'채점자용 (교수·조교 전용)':'학생 공개용'} · ${sheetVer}형</h4>

  <div class="ft"><span>${kind==='grader'?'오타는 자동 정답 처리하지 않고 검토로 보냄 · 채점 중 추가된 인정 답안 반영':'성적 공개 후 배포 · 이의신청은 학과 사무실'}</span><span class="mono">ANAT-2027-1-MID · ${sheetVer} · 정답지 v${1+Object.values(S.added).reduce((a,o)=>a+Object.values(o).flat().length,0)} · 생성 ${now()}</span></div></div>`;

let rvFilter='open', rvItem='all';

  const gs=Object.entries(groups).sort((a,b)=>{const ia=ITEMS.findIndex(i=>i.id===a[1][0].c.q),ib=ITEMS.findIndex(i=>i.id===b[1][0].c.q);return ia-ib||b[1].length-a[1].length});

    <span class="pill ${open?'p-warn':'p-ok'}">${open?`검토 대기 ${open}칸`:'검토 완료'}</span></div>

    <label for="rvi">문항 <select id="rvi"><option value="all">전체</option>${ITEMS.map(i=>`<option value="${i.id}" ${rvItem===i.id?'selected':''}>${i.id} · ${i.ch}</option>`).join('')}</select></label>

function groupCard(gk,xs,gi){
  const x0=xs[0];const it=IT[x0.c.q];const j=x0.j;
  const sev=x0.r==='done'?'done':x0.r==='auto'?'sample':xs.some(x=>x.r==='must')?'must':'rec';
  const confs=xs.map(x=>x.c.conf).filter(v=>v!=null);

  const per=it.pts/it.slots.length;

  const reasons=new Set();xs.forEach(x=>{if(x.c.corrected&&S.fix[x.c.key]===undefined)reasons.add('고쳐 쓴 답');if(x.c.outside&&S.fix[x.c.key]===undefined)reasons.add('칸 밖 기재');if(x.c.faint)reasons.add('연한 글씨');if(x.c.conf!=null&&x.c.conf<S.th.lo)reasons.add('판독 신뢰도 낮음')});

  const done=x0.r==='done'?S.over[x0.c.key]:null;
  return `<section class="group sev-${sev}" data-g="${gi}" data-keys="${xs.map(x=>x.c.key).join(',')}">
    <div class="g-head"><div class="who"><div class="read"><span class="q">${it.id}${pos?' · '+pos:''}</span>${x0.text?`판독 ‘${esc(x0.text)}’`:'<span class="muted">판독된 글자 없음</span>'}</div>
      <div class="small muted">${esc(it.stem)}</div></div>
      <div class="row">${pill(...VL[j.v])} ${pill(...RL[x0.r])} <span class="pill p-mute">${xs.length}칸</span> <span class="small muted mono">신뢰도 ${cr}</span></div></div>
    <div class="g-body">${xs.slice(0,12).map(x=>`<div class="cellcard">${ansImg(x.c)}
      <div class="meta"><span class="mono">${who(studentOf(SCANS[x.c.si]))}</span><span class="mono">${x.c.conf==null?'빈칸':x.c.conf.toFixed(2)}</span></div>
      <div class="fix"><input type="text" id="fix-${x.c.key.replace(/\|/g,'-')}" placeholder="판독 수정" value="${S.fix[x.c.key]!==undefined?esc(S.fix[x.c.key]):''}" aria-label="판독 수정"><button class="btn" type="button" data-fix="${x.c.key}">적용</button></div></div>`).join('')}
      ${xs.length>12?`<span class="small muted" style="align-self:center">외 ${xs.length-12}칸</span>`:''}</div>
    <div class="g-act">
      <span class="small"><b>엔진:</b> ${esc(j.why)}${reasons.size?` · <b style="color:var(--bad)">${[...reasons].join(', ')}</b>`:''}</span>
      <span style="flex-basis:100%;height:0"></span>
      ${done?`<span class="small">${done.score>0?'정답':'오답'} 처리 (${f1(done.score)}점) · ${esc(done.by)} · ${done.at}${done.reason?' · '+esc(done.reason):''}</span><button class="btn ghost" type="button" data-undo="1">되돌리기</button>`:`
      <input type="text" id="why-${gi}" placeholder="사유 (선택) 예: 옛 용어 표기 인정" aria-label="사유">

    </div></section>`;
}

let grView='exam';
function rankAndGrade(rows){
  const sorted=[...rows].sort((a,b)=>b.total-a.total);
  sorted.forEach((r,i)=>{r.rank=i>0&&sorted[i-1].total===r.total?sorted[i-1].rank:i+1});
  const n=rows.length;
  rows.forEach(r=>{const p=r.total/TOTAL*100;r.pctv=p;
    if(S.gradeMode==='abs') r.grade=p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';
    else r.grade=r.rank<=Math.ceil(n*.3)?'A':r.rank<=Math.ceil(n*.65)?'B':p>=60?'C':'F'});
  return rows;
}
function itemStats(rows){
  const n=rows.length;const k=Math.max(1,Math.round(n*.27));
  const sorted=[...rows].sort((a,b)=>b.total-a.total);const up=sorted.slice(0,k),lo=sorted.slice(-k);
  return ITEMS.map(it=>{
    const mean=rows.reduce((a,r)=>a+r.items[it.id],0)/n;const p=mean/it.pts;
    const D=(up.reduce((a,r)=>a+r.items[it.id],0)/k-lo.reduce((a,r)=>a+r.items[it.id],0)/k)/it.pts;
    let blank=0;const wrongs={};
    rows.forEach(r=>{const cs=r.sc.cells.filter(c=>c.q===it.id);if(cs.every(c=>!readText(c)))blank++;
      cs.forEach(c=>{const e=EV.cells[c.key];if(e.score===0&&e.text){const t=e.text.trim();wrongs[t]=(wrongs[t]||0)+1}})});
    const top=Object.entries(wrongs).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const flags=[];if(p<.3)flags.push(['너무 어려움','p-bad']);if(p>.92)flags.push(['너무 쉬움','p-info']);if(D<.2)flags.push(['변별도 낮음','p-warn']);
    return {it,p,D,blank:blank/n,top,flags};
  });
}

// 가상 교수 채점 기준 (기획서에 없는 부분은 아래 기준을 가정)
const PROF_EXTRA={Q1:['상완뼈'],Q7:['삼첨판막']};
const PROF_RULES=['새 용어·옛 용어·영어 표기 모두 정답','한글 자모 1개 수준의 맞춤법 오타는 정답 인정','사전에 없어도 의미가 같은 혼용 표기(상완뼈, 삼첨판막)는 정답 인정','순서 문항에서 자리가 바뀐 칸은 0점, 같은 답 중복은 한 번만 인정','연하게 쓴 답, 고쳐 쓴 최종 답, 칸 밖에 쓴 답도 읽을 수 있으면 채점'];
const PILOT=PILOT_RAW.map((s,si)=>({...s,cells:ITEMS.flatMap(it=>(s.a[it.id]||[]).map((v,k)=>{
  const [t,o]=Array.isArray(v)?v:[v,{}];const blank=!t;
  const ocr=o.ocr!==undefined?o.ocr:(o.faint?'':t);
  const conf=o.conf!==undefined?o.conf:(blank||(o.faint)?null:.95);
  return {key:`P|${si}|${it.id}|${k}`,si,q:it.id,k,trueText:t,ocr,conf,faint:!!o.faint,corrected:o.corrected||null,outside:!!o.outside,rot:(((si*7+k*3)%5)-2)*.6};
}))}));
function profJudge(it,texts){
  const n=it.slots.length,per=it.pts/n;const used=new Set();
  const base=m=>[...it.slots[m].map(x=>x.t),...(PROF_EXTRA[it.id]||[])];
  const ok=(m,t)=>{if(!t)return false;const tn=norm(t);return base(m).some(b=>{const bn=norm(b);if(bn===tn)return true;return /[가-힣]/.test(tn)&&lev(jamo(tn),jamo(bn))<=1})};
  return texts.map((t,k)=>{
    if(it.type==='single'||it.order){return ok(it.type==='single'?0:k,t)?per:0}
    for(let m=0;m<n;m++){if(!used.has(m)&&ok(m,t)){used.add(m);return per}}return 0;
  });
}
function pilotEval(){
  const rows=PILOT.map(s=>{
    let prof=0,eng=0,after=0,rev=0,autoN=0,autoBad=0;const diffs=[];
    for(const it of ITEMS){
      const cs=s.cells.filter(c=>c.q===it.id);
      const js=judgeItem(it,cs);const ps=profJudge(it,cs.map(c=>c.trueText));
      cs.forEach((c,k)=>{const j=js[k];const r=route(c,j);const p=ps[k];
        prof+=p;eng+=j.score;
        const reviewed=r==='must'||r==='rec';
        if(reviewed){rev++;after+=p}else{autoN++;after+=j.score;if(Math.abs(j.score-p)>1e-9)autoBad++}
        if(Math.abs(j.score-p)>1e-9||reviewed&&c.trueText!==readText(c)){
          let cause;
          if(norm(readText(c))!==norm(c.trueText)) cause=c.faint||c.outside?'판독 누락(연한 글씨·칸 밖)':'판독 오류';
          else if(j.v==='typo') cause='맞춤법 오타 (교수 인정)';
          else if((PROF_EXTRA[it.id]||[]).some(x=>norm(x)===norm(c.trueText))) cause='인정 범위 차이 (사전에 없는 표기)';
          else cause='판정 차이';
          diffs.push({c,it,j,r,p,cause,reviewed});
        }
      });
    }
    return {s,prof,eng,after,rev,autoN,autoBad,diffs};
  });
  const cells=rows.reduce((a,r)=>a+r.autoN+r.rev,0),auto=rows.reduce((a,r)=>a+r.autoN,0),bad=rows.reduce((a,r)=>a+r.autoBad,0);
  return {rows,cells,auto,bad,
    engMatch:rows.filter(r=>Math.abs(r.eng-r.prof)<1e-9).length,
    afterMatch:rows.filter(r=>Math.abs(r.after-r.prof)<1e-9).length};
}

  if(pilotSet==='real') return `<div class="head"><div><h2>파일럿 비교</h2><p>답안지를 이 프로그램의 채점 엔진에 넣고, 같은 답안지를 교수가 수기로 채점한 결과와 비교합니다. 기획서 11절의 검증 방식과 같습니다.</p></div>${tg}</div>`+vPilotReal();
  const P=pilotEval();const n=P.rows.length;
  const autoRate=P.auto/P.cells, badRate=P.auto?P.bad/P.auto:0, afterRate=P.afterMatch/n;

  <div class="kpis">

    ${kpi('자동 확정 오판정률',pct(badRate),`목표 0.5% 이하 · 오판정 ${P.bad}칸 ${badRate<=.005?'충족':'미달'}`)}
    ${kpi('검토 후 총점 일치',`${P.afterMatch}/${n}명`,`목표 98% 이상 · ${pct(afterRate)} ${afterRate>=.98?'충족':'미달'}`,afterRate,.98)}
    ${kpi('검토 전 엔진 총점 일치',`${P.engMatch}/${n}명`,'참고: 사람이 전혀 보지 않았을 때')}

      <li>자동 확정 오판정 ${P.bad}칸 (${pct(badRate)}): ${verdict(badRate<=.005)} ${autoDiffs.map(d=>`${d.s.no} ${d.it.id} ‘${esc(d.c.trueText)}’(${d.cause})`).join(', ')||''}</li>

  const autoBad=disagree.filter(d=>!d.reviewed);
  const fixTerms=[...new Set(disagree.filter(d=>d.pOk).map(d=>`${d.it.id} ‘${d.c.trueText}’`))];
  return `<div class="panel small"><b>이 화면의 데이터</b>: 실제 답안지 5장(경북전문대학교 직무수행능력평가지, 19문항 100점)입니다. 이름·학번 칸은 판독 전에 검게 가렸고 어디에도 기록하지 않았습니다. 답란 손글씨는 비전 AI가 읽었고(신뢰도는 판독자가 매긴 값), 교수 채점은 답안지의 빨간 펜 표시(○, 소계, 총점)를 그대로 옮겼습니다. 정답 사전은 만점 답안지(S01)와 해부학 용어(새 용어·옛 용어·영어)로 만들었고, 교수가 실제로 인정한 다른 표기는 일부러 넣지 않았습니다.</div>
  <div class="kpis">
    ${kpi('자동 확정 비율',pct(autoRate),`목표 70% 이상 · ${P.auto}/${P.cells}칸`,autoRate,.7)}
    ${kpi('자동 확정 오판정률',pct(badRate),`목표 0.5% 이하 · 오판정 ${P.bad}칸`)}
    ${kpi('검토 후 총점 일치',`${P.afterMatch}/${n}명`,`목표 98% 이상 · ${pct(afterRate)}`,afterRate,.98)}
    ${kpi('검토 전 엔진 총점 일치',`${P.engMatch}/${n}명`,'참고: 사람이 전혀 보지 않았을 때')}
  </div>
  <div class="grid2">
    <div class="panel"><h3>결론</h3><ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px">
      <li>자동 확정 비율 ${pct(autoRate)} ${verdict(autoRate>=.7)} · 오판정률 ${pct(badRate)} ${verdict(badRate<=.005)} · 검토 후 총점 일치 ${P.afterMatch}/${n}명 ${verdict(afterRate>=.98)}</li>
      <li>엔진과 교수 판정이 다른 칸은 ${disagree.length}칸이고, 모두 <b>교수는 정답, 엔진은 오답</b>인 경우입니다. 엔진이 교수보다 점수를 더 준 칸은 없습니다.</li>
      <li>${autoBad.length?`그중 ${autoBad.length}칸은 판독 신뢰도가 높아 검토 없이 오답으로 자동 확정되었습니다: ${autoBad.map(d=>`${d.s.no} ${d.it.id} ‘${esc(d.c.trueText)}’`).join(', ')}.`:'오판정 칸은 모두 검토로 넘어갔습니다.'}</li>
      <li>원인은 판독이 아니라 <b>인정 답안 사전</b>입니다. 괄호 병기, ‘분자’·‘복합체’ 같은 덧붙임, 용어 앞뒤 바꿈을 교수는 인정했습니다. 이 표기를 사전에 넣거나, ‘오답 자동 확정’을 하지 않고 정답 일부를 포함한 답은 검토로 보내는 규칙이 필요합니다.</li>
      <li>교수가 오답 처리한 ‘노뼈손목굽힘근’(정답: 노쪽손목굽힘근)은 엔진도 오답으로 판정했습니다. 교수 기준과 엔진 기준이 같은 사례입니다.</li>
    </ul></div>
    <div class="panel"><h3>사전에 추가할 표기 (교수 인정)</h3>${fixTerms.length?`<div class="row">${fixTerms.map(t=>`<span class="chip added">${esc(t)}</span>`).join('')}</div>`:'<p class="small muted">없음</p>'}
      <h3 style="margin:14px 0 8px">교수 채점 옮겨 적기 확인</h3><p class="small" style="margin:0">칸별 ○ 표시로 다시 계산한 총점이 답안지에 적힌 총점과 ${P.writtenOk?'5장 모두 같습니다.':'다른 답안지가 있습니다. 표를 확인하세요.'} 17번은 ‘1개 4점, 2개 7점, 3개 10점’ 규칙을 적용했습니다.</p></div>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>답안지</th><th style="min-width:220px">특징</th><th class="n">답안지 총점</th><th class="n">교수 (칸별 재계산)</th><th class="n">엔진 (검토 전)</th><th class="n">검토 칸</th><th class="n">검토 후</th><th>일치</th></tr></thead>
  <tbody>${P.rows.map(r=>`<tr><td class="mono">${r.s.no}</td><td class="small">${esc(r.s.note)}</td><td class="n">${r.s.written}</td><td class="n">${f1(r.prof)}</td><td class="n">${f1(r.eng)}${r.eng!==r.prof?` <span class="muted">(${f1(r.eng-r.prof)})</span>`:''}</td><td class="n">${r.rev}</td><td class="n"><b>${f1(r.after)}</b></td><td>${r.after===r.prof?pill('일치','p-ok'):pill(`차이 ${f1(r.after-r.prof)}`,'p-bad')}</td></tr>`).join('')}</tbody></table></div>
  <div class="panel"><h3>문항별 점수 비교 <span class="small muted">교수 / 엔진(검토 전)</span></h3>
  <div class="tbl-wrap" style="border:0"><table><thead><tr><th>답안지</th>${REAL_ITEMS.map(i=>`<th class="n">${i.id.slice(1)}</th>`).join('')}</tr></thead>
  <tbody>${P.rows.map(r=>`<tr><td class="mono">${r.s.no}</td>${REAL_ITEMS.map(i=>{const x=r.items[i.id];const same=x.pi===x.ei;return `<td class="n" style="${same?'':'background:var(--bad-soft);color:var(--bad)'}">${f1(x.pi)}${same?'':'/'+f1(x.ei)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h3>검토로 간 칸과 판정이 다른 칸 <span class="small muted">${all.length}칸</span></h3>
  <div class="tbl-wrap" style="border:0"><table><thead><tr><th>답안지</th><th>문항</th><th>판독</th><th class="n">신뢰도</th><th>엔진</th><th>교수</th><th>처리</th><th>원인</th></tr></thead>
  <tbody>${all.map(d=>`<tr><td class="mono">${d.s.no}</td><td class="mono small">${d.it.id}${d.it.type==='multi'?'-'+(d.c.k+1):''}</td><td>${esc(d.c.trueText)}${d.c.corrected?` <span class="small muted">(고쳐 씀)</span>`:''}</td><td class="n">${d.c.conf.toFixed(2)}</td><td>${pill(...VL[d.j.v])}</td><td>${d.pOk?pill('정답','p-ok'):pill('오답','p-bad')}</td><td>${d.reviewed?pill(RL[d.r][0],'p-warn'):d.eOk!==d.pOk?pill('자동 확정 · 오판정','p-bad'):pill('자동 확정','p-ok')}</td><td class="small">${d.cause}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin:8px 0 0">‘검토 후’는 검토로 간 칸을 교수 기준대로 판정한다고 가정한 값입니다. 판독 결과는 교수의 빨간 펜 표시가 이미 있는 스캔본에서 읽었으므로, 표시가 없는 원본을 읽을 때보다 판독이 쉬웠을 수도, 어려웠을 수도 있습니다.</p></div>`;
}

/* =========================================================
   12. 라우팅·이벤트
   ========================================================= */
let EV=null;
const ROUTES={overview:vOverview,bank:vBank,sheet:vSheet,scan:vScan,review:vReview,grades:vGrades,guide:vGuide,pilot:vPilot};
function render(keepScroll){
  EV=evaluate();
  const r=(location.hash||'#overview').slice(1);const route=ROUTES[r]?r:'overview';
  const y=window.scrollY;
  $('#view').innerHTML=ROUTES[route](EV);
  document.querySelectorAll('#nav a').forEach(a=>{if(a.dataset.r===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const open=Object.values(EV.cells).filter(x=>(x.r==='must'||x.r==='rec')&&studentOf(SCANS[x.c.si])).length;
  const idI=SCANS.filter(s=>!studentOf(s)).length;
  $('#c-review').textContent=open;$('#c-review').classList.toggle('zero',!open);
  $('#c-scan').textContent=idI||'';$('#c-scan').classList.toggle('zero',!idI);
  $('#role').value=S.role;
  if(keepScroll) window.scrollTo(0,y);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
$('#role').addEventListener('change',e=>{S.role=e.target.value;save();render(true);toast(`${S.role} 권한으로 전환했습니다`)});
$('#reset').addEventListener('click',()=>{const role=S.role;S=fresh();S.role=role;save();render();toast('데모를 처음 상태로 되돌렸습니다')});

document.addEventListener('click',async e=>{
  const j=e.target.closest('[data-jump]');if(j){e.preventDefault();document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  const t=e.target.closest('button,[data-stu],[data-close]');if(!t)return;
  const d=t.dataset;
  if(d.ver){sheetVer=d.ver;return render(true)}
  if(d.mode){sheetMode=d.mode;return render(true)}
  if(d.step){scanView=(scanView+ +d.step+SCANS.length)%SCANS.length;return render(true)}
  if(d.view!==undefined){scanView=+d.view;render(true);document.getElementById('scanSheet')?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.skew!==undefined){scanSkew=d.skew==='1';const el=document.getElementById('scanSheet');if(el){el.classList.toggle('skew',scanSkew);t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t))}return}
  if(d.idfix!==undefined){const si=+d.idfix;const v=document.getElementById('idsel-'+si).value;if(!v)return;S.idfix[si]=v;log(`답안지 ${si+1}번을 응시자 ${v}로 지정`,SCANS[si].marked?`마킹 ${SCANS[si].marked} 명단에 없음, 좌석표 대조`:'번호 마킹 없음, 좌석표 대조');save();render(true);return toast('응시 번호를 지정했습니다')}
  if(d.rm){const [q,m,term]=d.rm.split('|');const arr=(S.added[q]||{})[m]||[];S.added[q][m]=arr.filter(x=>x!==term);log(`${q} 인정 답안에서 ‘${term}’ 삭제`);save();render(true);return toast('인정 답안에서 삭제했습니다')}
  if(d.fix){const key=d.fix;const inp=document.getElementById('fix-'+key.replace(/\|/g,'-'));const v=inp.value.trim();const c=CELL[key];
    if(!v&&S.fix[key]===undefined)return;
    if(v)S.fix[key]=v;else delete S.fix[key];
    log(`${c.q} 판독 수정: ‘${c.ocr||'빈칸'}’ → ‘${v||'(원래 판독)'}’`,'답안 이미지 확인');save();render(true);return toast('판독을 고치고 다시 채점했습니다')}
  if(d.act||d.undo){
    const sec=t.closest('section.group');const keys=sec.dataset.keys.split(',');const gi=sec.dataset.g;
    if(d.undo){keys.forEach(k=>delete S.over[k]);log(`${CELL[keys[0]].q} 판정 되돌림`,'',keys.length);save();render(true);return toast('판정을 되돌렸습니다')}
    const why=(document.getElementById('why-'+gi)?.value||'').trim();
    const it=IT[CELL[keys[0]].q];const per=it.pts/it.slots.length;
    const score=d.act==='ok'||d.act==='add'?per:d.act==='half'?per/2:0;
    const x0=EV.cells[keys[0]];
    if(d.act==='add'){
      const slot=it.type==='single'?0:it.order?CELL[keys[0]].k:+(document.getElementById('slot-'+gi)?.value??x0.j.slot??0);
      S.added[it.id]=S.added[it.id]||{};S.added[it.id][slot]=S.added[it.id][slot]||[];
      if(!S.added[it.id][slot].includes(x0.text))S.added[it.id][slot].push(x0.text);
      log(`${it.id} 인정 답안에 ‘${x0.text}’ 추가 (${it.slots[slot][0].t})`,why);
    }
    keys.forEach(k=>S.over[k]={score,by:S.role,at:now(),reason:why});
    log(`${it.id} ‘${x0.text||'빈칸'}’ ${score===per?'정답':score>0?'부분 점수':'오답'} 처리`,why,keys.length);
    save();render(true);return toast(`${keys.length}칸을 처리했습니다`);
  }
  if(d.gv){grView=d.gv;return render(true)}
  if(d.ps){pilotSet=d.ps;return render(true)}
  if(d.gm){S.gradeMode=d.gm;save();return render(true)}
  if(t.id==='csv'){
    const rows=rankAndGrade(Object.values(EV.bySi).filter(x=>x.st).map(x=>({...x}))).sort((a,b)=>a.st.id.localeCompare(b.st.id));
    const csv=['응시번호,'+ITEMS.map(i=>i.id).join(',')+',총점,백분율,석차,등급',...rows.map(r=>[r.st.id,...ITEMS.map(i=>f1(r.items[i.id])),f1(r.total),f1(r.pctv),r.rank,r.grade].join(','))].join('\n');
    log('시험 성적표 CSV 내보내기');save();
    try{await navigator.clipboard.writeText(csv);toast('CSV를 클립보드에 복사했습니다')}
    catch(err){$('#csvbox').innerHTML=`<p class="small muted">복사가 막혀 있어 아래에 표시했습니다. 전체 선택 후 복사하세요.</p><textarea class="csv" id="csvtext" readonly>${esc(csv)}</textarea>`;$('#csvtext').select()}
    return;
  }
  if(t.id==='final'){S.finalized=true;log('중간고사 성적 확정');save();render(true);return toast('성적을 확정했습니다')}
  if(d.stu!==undefined){$('#drawer-root').innerHTML=feedback(+d.stu);return}
  if(d.close){$('#drawer-root').innerHTML='';return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer-root').innerHTML='';if(e.key==='Enter'&&e.target.dataset?.stu!==undefined)$('#drawer-root').innerHTML=feedback(+e.target.dataset.stu)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='rvf'){rvFilter=t.value;return render(true)}
  if(t.id==='rvi'){rvItem=t.value;return render(true)}
  if(t.id==='thHi'||t.id==='thLo'){const v=+t.value;if(t.id==='thHi')S.th.hi=Math.max(v,S.th.lo+.01);else S.th.lo=Math.min(v,S.th.hi-.01);log(`판독 신뢰도 기준 변경: 자동 확정 ${S.th.hi.toFixed(2)}, 필수 검토 ${S.th.lo.toFixed(2)}`);save();return render(true)}
  if(t.dataset.w){S.weights[t.dataset.w]=Math.max(0,Math.min(100,+t.value||0));save();return render(true)}
});
document.addEventListener('input',e=>{if(e.target.type==='range'){const s=e.target.nextElementSibling;if(s)s.textContent=(+e.target.value).toFixed(2)}});
render();
</script>
